<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>NETLII | AI</title>
    <style>
        :root {
            --text-color: #1a1a1a;
            --container-bg: rgba(255, 255, 255, 0.85);
            --body-bg: #f4f4f4;
            --accent-blue: #2196F3;
            --sidebar-bg: rgba(255, 255, 255, 0.5);
            --bg-image: url('netlii-bg.avif');
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] {
            --text-color: #ffffff;
            --container-bg: rgba(15, 15, 15, 0.85);
            --body-bg: #121212;
            --sidebar-bg: rgba(0, 0, 0, 0.65);
            --bg-image: url('netlii-bg 2.avif');
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Nunito', sans-serif; background: var(--body-bg) var(--bg-image) center/cover fixed; color: var(--text-color); display: flex; overflow: hidden; transition: 0.4s; }

        /* Sidebar & History Scrollbar */
        .sidebar { width: 300px; background: var(--sidebar-bg); backdrop-filter: blur(30px); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 25px; transition: margin-left 0.3s ease; z-index: 100; flex-shrink: 0; }
        .sidebar.collapsed { margin-left: -300px; }
        
        .chat-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            padding-right: 8px;
        }

        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--text-color); border-radius: 10px; opacity: 0.2; }

        .brand { font-size: 2.2rem; letter-spacing: 5px; font-weight: 900; margin-bottom: 30px; text-align: center; }
        
        .sidebar-btn { padding: 12px; border-radius: 15px; border: 2px solid var(--text-color); background: transparent; color: var(--text-color); font-weight: 900; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .new-chat { margin-bottom: 20px; }
        .new-chat:hover { background: var(--text-color); color: var(--body-bg); }
        
        .clear-all { margin-top: 20px; border-color: #ff4747; color: #ff4747; font-size: 0.8rem; opacity: 0.7; }
        .clear-all:hover { background: #ff4747; color: white; opacity: 1; }

        .chat-item { padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.05); font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        .chat-item:hover { border-color: var(--accent-blue); }

        /* Main Stage */
        .main { flex-grow: 1; height: 100vh; display: flex; flex-direction: column; position: relative; min-width: 0; }
        .nav { height: 70px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); }
        .stage { flex-grow: 1; padding: 40px 15%; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; position: relative; group: relative; }
        .user-wrapper { align-self: flex-end; align-items: flex-end; }
        .ai-wrapper { align-self: flex-start; align-items: flex-start; }

        .msg { width: 100%; padding: 20px; border-radius: 25px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .user-msg { background: var(--accent-blue); color: white; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--container-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        
        /* Actions Toolbar */
        .msg-actions { display: flex; gap: 8px; margin-top: 6px; padding: 0 5px; opacity: 0.8; transition: opacity 0.2s; }
        .msg-actions button { background: none; border: none; color: var(--text-color); cursor: pointer; font-size: 0.9rem; padding: 2px 5px; border-radius: 4px; }
        .msg-actions button:hover { background: rgba(255,255,255,0.2); }

        /* File Attachment Previews */
        .attachments-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .file-chip { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.1); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--glass-border); }
        .file-chip img { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; }
        .file-chip .remove-file { cursor: pointer; font-weight: bold; margin-left: 5px; }

        .input-attachments { display: flex; gap: 8px; padding: 0 10px 10px; flex-wrap: wrap; }
        
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 12px; overflow-x: auto; font-family: 'Courier New', monospace; margin: 10px 0; white-space: pre; }
        
        .ri-spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .footer { padding: 20px 15% 40px; display: flex; flex-direction: column; }
        .input-wrap { background: var(--container-bg); backdrop-filter: blur(20px); border-radius: 30px; padding: 10px 20px; display: flex; flex-direction: column; border: 2px solid var(--text-color); }
        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-wrap input[type="text"] { flex-grow: 1; background: transparent; border: none; color: var(--text-color); padding: 10px; font-size: 1.1rem; outline: none; }
        
        .btn-action { background: transparent; color: var(--text-color); width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.2s; }
        .btn-action:hover { background: rgba(0,0,0,0.05); }
        .btn-send { background: var(--text-color); color: var(--body-bg); width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">NETLII <span style="font-weight: 400; opacity: 0.5;">AI</span></div>
        <button class="sidebar-btn new-chat" onclick="startNewChat()"><i class="ri-add-line"></i> NEW SESSION</button>
        
        <div class="chat-list" id="history"></div>

        <button class="sidebar-btn clear-all" onclick="clearAllChats()"><i class="ri-delete-bin-line"></i> CLEAR ALL</button>
    </aside>

    <main class="main">
        <header class="nav">
            <div style="display:flex; align-items:center; gap:20px;">
                <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--text-color); font-size:1.5rem; cursor:pointer;"><i class="ri-menu-fold-line"></i></button>
                <select id="model" style="padding:8px 15px; border-radius:20px; background:var(--container-bg); color:var(--text-color); border:1px solid var(--text-color); font-weight:900;">
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                    <option value="gemini-3.7-pro">Gemini 3.7 Pro</option>
                    <option value="gemini-flash-latest">Gemini Flash Latest</option>
                    <option value="gemini-pro-latest">Gemini Pro Latest</option>
                    <option value="gemini-3-pro-image">Gemini Image</option>
                </select>
            </div>
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
        </header>

        <div class="stage" id="stage">
            <strong>Welcome.</strong><br>
            Use the menu icon to toggle the sidebar and "New Session" to clear the stage.<br>
            <strong>I'm Ready when you are.</strong>
        </div>

        <footer class="footer">
            <div class="input-wrap">
                <div class="input-attachments" id="input-attachments"></div>
                <div class="input-row">
                    <button class="btn-action" onclick="document.getElementById('file-input').click()" title="Attach file">
                        <i class="ri-attachment-2"></i>
                    </button>
                    <input type="file" id="file-input" multiple style="display: none;" onchange="handleFileSelect(event)">
                    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
                    <button class="btn-send" onclick="send()"><i class="ri-send-plane-fill"></i></button>
                </div>
            </div>
        </footer>
    </main>
